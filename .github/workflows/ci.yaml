# This config uses industrial_ci (https://github.com/ros-industrial/industrial_ci.git).
# For troubleshooting, see readme (https://github.com/ros-industrial/industrial_ci/blob/master/README.rst)

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ros2

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        env:
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_ADDRESS=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Address Sanitizer
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_THREAD=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Thread Sanitizer
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Undefined Behavior Sanitizer
          - TARGET_CMAKE_ARGS: -DCLASS_LOADER_USE_RCPPUTILS=OFF
            NAME: Without rcpputils
    env:
      ROS_DISTRO: rolling
    runs-on: ubuntu-latest
    name: ${{ matrix.env.NAME }}
    steps:
      - uses: actions/checkout@v7
      # ThreadSanitizer fails with "incompatible memory layout" under the
      # runner kernel's default ASLR entropy (vm.mmap_rnd_bits=32). The
      # industrial_ci container shares the host kernel, so lower it here.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}

  # Build and test without ament and ROS (CLASS_LOADER_IGNORE_AMENT=ON, dependencies from the
  # system's package manager), install, and check the installed library via CMake and
  # pkg-config (not on Windows).
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Standalone (without ROS, ${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libconsole-bridge-dev libgtest-dev pkg-config
          echo "INSTALL_PREFIX=$GITHUB_WORKSPACE/install" >> "$GITHUB_ENV"
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install console_bridge googletest pkgconf
          echo "INSTALL_PREFIX=$GITHUB_WORKSPACE/install" >> "$GITHUB_ENV"
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install console-bridge gtest --triplet x64-windows
          vcpkg_root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkg_root/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          cygpath -w "$vcpkg_root/installed/x64-windows/bin" >> "$GITHUB_PATH"
          echo "INSTALL_PREFIX=$(cygpath -m "$GITHUB_WORKSPACE/install")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCLASS_LOADER_IGNORE_AMENT=ON -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"
          cmake --build build --parallel --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release
      - name: Install
        run: cmake --install build --config Release
      - name: Test installed library
        run: |
          export PKG_CONFIG_PATH="$INSTALL_PREFIX/lib/pkgconfig"
          cmake -S test/standalone -B build_test -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$INSTALL_PREFIX"
          cmake --build build_test --parallel --config Release
          ctest --test-dir build_test --output-on-failure --build-config Release
