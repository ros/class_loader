# This config uses industrial_ci (https://github.com/ros-industrial/industrial_ci.git).
# For troubleshooting, see readme (https://github.com/ros-industrial/industrial_ci/blob/master/README.rst)

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ros2

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        env:
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_ADDRESS=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Address Sanitizer
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_THREAD=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Thread Sanitizer
          - TARGET_CMAKE_ARGS: -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: Undefined Behavior Sanitizer
    env:
      ROS_DISTRO: rolling
    runs-on: ubuntu-latest
    name: ${{ matrix.env.NAME }}
    steps:
      - uses: actions/checkout@v2
      # ThreadSanitizer fails with "incompatible memory layout" under the
      # runner kernel's default ASLR entropy (vm.mmap_rnd_bits=32). The
      # industrial_ci container shares the host kernel, so lower it here.
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}
